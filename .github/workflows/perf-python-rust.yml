name: Experimental Python Numba Rust PV performance

on:
  push:
    branches:
      - experiment/python-rust-perf-20261118
    paths:
      - 'scripts/perf_python_rust/**'
      - 'docs/python_rust_perf_experiment.md'
      - '.github/workflows/perf-python-rust.yml'

permissions:
  contents: read

jobs:
  profile-reference:
    name: Profile unchanged Python using PR57 package pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/requirements-pr54.txt
      - name: Record original Python bottlenecks
        run: python scripts/perf_python_rust/benchmark_pv.py --profile-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-python-reference
          path: work/python_rust_perf/
          if-no-files-found: warn

  comparative:
    name: Run equivalence and matched-environment comparisons
    runs-on: ubuntu-latest
    needs: profile-reference
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/requirements-pr54.txt
      - name: Use common compatible environment for all contenders
        run: python -m pip install numpy==2.4.2 numba==0.65.1 maturin==1.9.6
      - uses: dtolnay/rust-toolchain@stable
      - name: Record Rust and compiler environment
        run: rustc --version && cargo --version && python -m pip freeze
      - name: Build isolated extension only
        run: maturin build --release --manifest-path scripts/perf_python_rust/rust_pv/Cargo.toml --out dist
      - name: Install local wheel
        run: python -m pip install dist/*.whl
      - name: Run numerical equivalence before measuring speedups
        run: python scripts/perf_python_rust/benchmark_pv.py --compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-python-numba-rust
          path: work/python_rust_perf/
          if-no-files-found: warn
