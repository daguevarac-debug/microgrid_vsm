name: Validate Task 3.1 interface

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.head_ref == 'task-3-1-bess-controller-interface'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-3-1-bess-controller-interface
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas openpyxl

      - name: Apply interface patch
        run: python scripts/task_3_1_patch.py

      - name: Run targeted regressions
        run: |
          python src/validation/test_gfm_controller.py
          python src/validation/test_microgrid_controller_state_mapping.py
          python src/validation/test_bess_controller_interface.py

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/controllers/base.py src/controllers/grid_following.py src/controllers/gfm_controller.py src/microgrid.py src/validation/test_bess_controller_interface.py
          git rm scripts/task_3_1_patch.py
          git rm .github/workflows/task-3-1-patch.yml
          git rm .github/workflows/task-3-1-pr.yml
          git commit -m "feat: pass BESS supervision inputs to GFM controller"
          git push origin HEAD:task-3-1-bess-controller-interface
